<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="MetaTrack — live crypto prices, heatmap, watchlist, comparison and calculators. Free to use as a guest; sign in for portfolio and price alerts." />
    <meta name="theme-color" content="#07070a" />
    <title>MetaTrack — Track the whole crypto market. No sign-in needed.</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MetaTrack — Track the whole crypto market" />
    <meta property="og:description" content="Live prices, heatmap, watchlist, calculators and more. Use it instantly as a guest — sign in only for portfolio and alerts." />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500;600;700&display=swap" />
    <script>
      // Apply the saved theme + motion before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem("metatrack:settings:v2") || "{}");
        var t = s.theme || "dark";
        if (t === "system") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        var m = s.motion || "full";
        if (m === "system") m = "full"; // "system" was the old default; the landing is designed to move
        document.documentElement.dataset.motion = m;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
